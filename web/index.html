<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Policy Playground</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header class="toolbar">
      <div class="toolbar-half toolbar-half-examples">
        <div class="toolbar-brand">
          <img
            class="toolbar-logo"
            src="./src/ocm-logo-hept.png"
            alt=""
            width="40"
            height="40"
          />
          <h1 class="toolbar-title">Policy Playground</h1>
        </div>
        <div class="example-menu">
          <button
            type="button"
            id="example-menu-toggle"
            class="example-menu-toggle"
            aria-expanded="false"
            aria-haspopup="listbox"
          >
            Load an example…
          </button>
          <div id="example-menu-panel" class="example-menu-panel" hidden></div>
        </div>
      </div>
      <div class="toolbar-half toolbar-half-share">
        <div class="share-controls">
          <button type="button" id="export-btn" class="toolbar-btn">Copy share link</button>
          <p id="share-status" class="share-status" role="status" aria-live="polite"></p>
        </div>
      </div>
    </header>

    <main class="editors">
      <section class="pane">
        <div class="pane-chrome-head">
          <h2 class="pane-title">Policy</h2>
        </div>
        <p class="hint">
          The <code>ConfigurationPolicy</code> to evaluate.
        </p>
        <div id="policy-editor" class="editor editor-scroll"></div>
      </section>

      <section class="pane pane-tabbed">
        <div class="pane-chrome-head pane-header-tabs">
          <h2 class="pane-title">Cluster</h2>
          <div class="pane-tabs" role="tablist" aria-label="Cluster">
            <button
              type="button"
              class="pane-tab is-active"
              role="tab"
              id="cluster-tab-resources"
              aria-selected="true"
              aria-controls="cluster-hint-resources cluster-editor-stack"
            >
              Resources
            </button>
            <button
              type="button"
              class="pane-tab"
              role="tab"
              id="cluster-tab-mappings"
              aria-selected="false"
              aria-controls="cluster-hint-mappings cluster-editor-stack"
              tabindex="-1"
            >
              API mappings
            </button>
          </div>
        </div>
        <div class="pane-hint-stack">
          <p class="hint" id="cluster-hint-resources">
            YAML objects to simulate cluster state. Separate multiple documents with
            <code>---</code>.
          </p>
          <p class="hint tab-hidden" id="cluster-hint-mappings">
            Optional additional API mappings for Custom Resources.
          </p>
        </div>
        <div id="cluster-editor-stack" class="pane-editor-stack">
          <div id="resources-editor" class="editor editor-scroll"></div>
          <div id="mappings-editor" class="editor editor-scroll tab-hidden"></div>
        </div>
      </section>
    </main>

    <section class="results-section">
      <div class="pane-header">
        <h2 class="pane-title">Results</h2>
        <button type="button" id="run-btn" class="run-btn">Simulate</button>
      </div>
      <div class="results-body">
        <div id="results-editor" class="editor editor-scroll"></div>
      </div>
    </section>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
